# ghostty passthrough (shift+enter, cmd+click, colors)
set -g default-terminal "tmux-256color"
set -as terminal-features ",ghostty:RGB:hyperlinks:usstyle"
set -g allow-passthrough on
set -s extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 0

# basics
set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -g set-clipboard on

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# session picker with kill binding (x to kill, enter to switch)
bind s choose-tree -sZ -O name

# splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# copy mode — behave like normal selection
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
set -g mode-style "bg=#333333,fg=#ededed"

# ctrl+click to open files/URLs/directories
set -g word-separators " -\"'(),\\[]{}<>"
bind -n C-MouseDown1Pane run-shell "~/.config/tmux/bin/open-smart-tmux \"#{pane_current_path}\" \"#{mouse_word}\""

# status bar — match starship session style
set -g status-style "bg=#0a0a0a,fg=#666666"
set -g status-left "#[fg=#666666,italics](#S) "
set -g status-right ""
set -g window-status-format "#[fg=#444444]#W"
set -g window-status-current-format "#[fg=#888888]#W"
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#444444"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
