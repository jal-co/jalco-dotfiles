[settings]
dotfiles.relative_symlinks = true

[dotfiles]
"~/.zshrc" = "zsh/.zshrc"
"~/.config/git" = "git"
"~/.config/ghostty" = "ghostty"
"~/.config/rex/init.lua" = "rex/config/init.lua"
"~/.config/rex/session-pins.lua" = "rex/plugins/session-pins/session-pins.lua"
"~/.config/rex/task-overview.lua" = "rex/config/task-overview.lua"
"~/.config/rex/modules.json" = "rex/config/modules.json"
"~/Library/LaunchAgents/com.jalco.rex-session-pins.plist" = "rex/launchd/com.jalco.rex-session-pins.plist"
"~/.config/eza" = "eza"
"~/.config/mise" = "mise"
"~/.config/ponytail" = "ponytail"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/zed" = "zed"
"~/.agents" = "agents"
"~/.local/bin/pinned" = "rex/bin/pinned"
"~/.local/bin/pinned-rex" = "rex/bin/pinned"
"~/.local/bin/rex-linear" = "rex/bin/rex-linear"
"~/.local/bin/boat-offload" = "tools/boat-offload/bin/boat-offload"
"~/.local/bin/rex" = "/Applications/Rex Beta.app/Contents/Helpers/Rex Server.rex/Contents/MacOS/rex"
"~/rex-coord/AGENTS.md" = "rex/coordinator/AGENTS.md"
"~/rex-coord/.pi/settings.json" = "rex/coordinator/settings.json"

[bootstrap.packages]
"brew:cmake" = "latest"
"brew:exiftool" = "latest"
"brew:eza" = "latest"
"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:gitleaks" = "latest"
"brew:git" = "latest"
"brew:gnupg" = "latest"
"brew:mise" = "latest"
"brew:mole" = "latest"
"brew:ninja" = "latest"
"brew:node" = "latest"
"brew:oxlint" = "latest"
"brew:proton-pass-cli" = "latest"
"brew:rust" = "latest"
"brew:starship" = "latest"
"brew:zoxide" = "latest"
"brew:hashicorp/tap/terraform" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:font-geist-mono" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:gcloud-cli" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:granola" = "latest"
"brew-cask:linear" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:thaw" = "latest"
"brew-cask:zed" = "latest"

[tasks.bootstrap]
run = "npm install -g @earendil-works/pi-coding-agent agent-browser@0.39.0 corepack superset vercel && mise run hooks && mise run scrawl"

[tasks.scrawl]
description = "Put the Scrawl CLI from Scrawl.app on PATH"
run = "mkdir -p ~/.local/bin && ln -sf /Applications/Scrawl.app/Contents/MacOS/scrawl ~/.local/bin/scrawl"

[tasks.hooks]
description = "Install the gitleaks pre-commit hook in the dotfiles repos"
run = """
for repo in "$HOME/dotfiles" "$HOME/dotfiles-private"; do
  [ -d "$repo/.git" ] || continue
  printf '#!/bin/sh\nexec gitleaks git --staged --redact --no-banner\n' > "$repo/.git/hooks/pre-commit"
  chmod +x "$repo/.git/hooks/pre-commit"
  echo "hook installed in $repo"
done
"""

[dotfiles."~/.pi/*.json"]
source = "pi/*.json"

[dotfiles."~/.pi/agent/*"]
source = "pi/agent/*"
