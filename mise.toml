[settings]
dotfiles.relative_symlinks = true

[dotfiles]
"~/.zshrc" = "zsh/.zshrc"
"~/.config/git" = "git"
"~/.config/ghostty" = "ghostty"
"~/.config/eza" = "eza"
"~/.config/mise" = "mise"
"~/.config/ponytail" = "ponytail"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/zed" = "zed"
"~/.agents" = "agents"

[bootstrap.packages]
"brew:cliproxyapi" = "latest"
"brew:cmake" = "latest"
"brew:exiftool" = "latest"
"brew:eza" = "latest"
"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:gnupg" = "latest"
"brew:herdr" = "latest"
"brew:mise" = "latest"
"brew:mole" = "latest"
"brew:ninja" = "latest"
"brew:node" = "latest"
"brew:oxlint" = "latest"
"brew:rust" = "latest"
"brew:starship" = "latest"
"brew:zoxide" = "latest"
"brew:hashicorp/tap/terraform" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:font-geist-mono" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:gcloud-cli" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:granola" = "latest"
"brew-cask:linear" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:thaw" = "latest"
"brew-cask:zed" = "latest"

[tasks.bootstrap]
run = "npm install -g @earendil-works/pi-coding-agent agent-browser@0.38.2 corepack superset vercel"

[tasks.cliproxy]
description = "Write the CLIProxyAPI and Usage Keeper configs with the Keychain keys and restart both"
run = """
key=$(security find-generic-password -s cliproxyapi-local -w 2>/dev/null || { k="cp-$(openssl rand -hex 24)"; security add-generic-password -a "$USER" -s cliproxyapi-local -w "$k"; echo "$k"; })
mgmt=$(security find-generic-password -s cliproxyapi-management -w 2>/dev/null || { k="cpm-$(openssl rand -hex 24)"; security add-generic-password -a "$USER" -s cliproxyapi-management -w "$k"; echo "$k"; })
keeper=$(security find-generic-password -s cpa-usage-keeper-login -w 2>/dev/null || { k="$(openssl rand -hex 16)"; security add-generic-password -a "$USER" -s cpa-usage-keeper-login -w "$k"; echo "$k"; })
sed -e "s/__CLIPROXY_API_KEY__/$key/" -e "s/__CLIPROXY_MANAGEMENT_KEY__/$mgmt/" cliproxyapi/config.yaml > "$(brew --prefix)/etc/cliproxyapi.conf"
sed -e "s/__CLIPROXY_MANAGEMENT_KEY__/$mgmt/" -e "s/__KEEPER_LOGIN_PASSWORD__/$keeper/" cpa-usage-keeper/keeper.env > "$(brew --prefix)/etc/cpa-usage-keeper.env"
chmod 600 "$(brew --prefix)/etc/cpa-usage-keeper.env"
brew services restart cliproxyapi
brew services restart cpa-usage-keeper
"""

[tasks.cliproxy-tui]
description = "Open the CLIProxyAPI terminal management UI"
run = 'cliproxyapi -config "$(brew --prefix)/etc/cliproxyapi.conf" -tui -password "$(security find-generic-password -s cliproxyapi-management -w)"'

[dotfiles."~/.pi/*.json"]
source = "pi/*.json"

[dotfiles."~/.pi/agent/*"]
source = "pi/agent/*"

[dotfiles."~/.config/herdr/*"]
source = "herdr/*"
