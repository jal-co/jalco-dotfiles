<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asks">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Asks</title>
<style>
:root { --bg: #f2f2f7; --surface: #fff; --text: #000; --text-2: rgba(60, 60, 67, 0.78); --separator: rgba(60, 60, 67, 0.29); --asks: oklch(0.56 0.14 60); --bad: oklch(0.54 0.2 27); --good: oklch(0.52 0.13 150); --link: #0a66d6; --hairline: 1px; }
@media (min-resolution: 2dppx) { :root { --hairline: 0.5px; } }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #1c1c1e; --text: #fff; --text-2: rgba(235, 235, 245, 0.6); --separator: rgba(84, 84, 88, 0.65); --asks: oklch(0.8 0.15 75); --bad: oklch(0.7 0.19 25); --good: oklch(0.74 0.16 150); --link: #4aa3ff; } }
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; min-height: 100dvh; font: 17px/1.3 system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) calc(env(safe-area-inset-bottom, 0px) + 32px) env(safe-area-inset-left, 0px); }
button { font: inherit; touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; }
h1 { margin: 0; padding: 12px 20px 2px; font-size: 34px; line-height: 41px; font-weight: 700; }
.summary { margin: 2px 20px 18px; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.group { margin: 0 16px; border-radius: 12px; background: var(--surface); overflow: hidden; }
.row { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 12px 16px; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 38px; right: 0; height: var(--hairline); background: var(--separator); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--asks); align-self: center; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.since { font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.what { grid-column: 2 / 4; font-size: 15px; line-height: 20px; color: var(--text-2); overflow-wrap: anywhere; }
.what b { font-weight: 500; color: var(--text); }
.empty { margin: 48px 32px; text-align: center; color: var(--text-2); font-size: 15px; }
.empty strong { display: block; margin-bottom: 4px; font-size: 17px; color: var(--text); }
.note { margin: 10px 32px 0; font-size: 13px; line-height: 18px; color: var(--text-2); }
.alerts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; margin: 28px 32px 0; font-size: 13px; line-height: 18px; color: var(--text-2); }
.alerts[data-tone="bad"] span { color: var(--bad); }
.alerts[data-tone="good"] span { color: var(--good); }
.link { min-height: 32px; padding: 0; border: 0; background: none; color: var(--link); font-size: 13px; }
.link:disabled { opacity: 0.4; }
</style>
</head>
<body>
<main>
  <h1>Asks</h1>
  <p class="summary" id="summary" aria-live="polite"></p>
  <div id="list"></div>
  <p class="note">Answer in Rex: open the tab, or use View Activity to find it.</p>
  <p class="alerts" id="alerts" role="status"></p>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
