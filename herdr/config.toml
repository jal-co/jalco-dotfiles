onboarding = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[ui]
status_indicators = "dots"
sidebar_width = 32
sidebar_min_width = 28
sidebar_max_width = 40

[theme]
name = "terminal"
auto_switch = false

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "speardragon.herdr-island.toggle"
description = "Herdr Island"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"
